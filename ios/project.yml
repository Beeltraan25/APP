# Proyecto de Xcode descrito en texto. En un Mac: `brew install xcodegen && xcodegen generate`
# crea DupeFinder.xcodeproj (no se sube a git).
name: DupeFinder

options:
  bundleIdPrefix: com.beeltraan25
  developmentLanguage: es
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Todo el código de la app se ejecuta en el hilo principal salvo que se diga lo contrario.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"

packages:
  DupeKit:
    path: Paquetes/DupeKit

targets:
  DupeFinder:
    type: application
    platform: iOS
    sources:
      - path: DupeFinder
    dependencies:
      - package: DupeKit
        product: DupeNucleo
      - package: DupeKit
        product: DupeDiseno
      - package: DupeKit
        product: DupeCompartir
      # La Share Extension va dentro de la app.
      - target: DupeFinderShare
    info:
      path: DupeFinder/Info.plist
      properties:
        CFBundleDisplayName: Dupe Finder
        CFBundleDevelopmentRegion: es
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Para hacer una foto de la prenda que quieres buscar.
        # Vienen de Config/Secretos.xcconfig. Vacíos = la app usa datos de prueba.
        URL_BACKEND: "$(URL_BACKEND)"
        CLAVE_APP: "$(CLAVE_APP)"
        # Permite hablar con el backend local (http://127.0.0.1) desde el simulador.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beeltraan25.dupefinder
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"

  # "Dupe Finder" en la hoja de compartir de Safari, Instagram, Fotos…
  DupeFinderShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DupeFinderShare
        excludes:
          - Info.plist
          - Preprocesado.js
      - path: DupeFinderShare/Preprocesado.js
        buildPhase: resources
    dependencies:
      - package: DupeKit
        product: DupeNucleo
      - package: DupeKit
        product: DupeDiseno
      - package: DupeKit
        product: DupeCompartir
    info:
      path: DupeFinderShare/Info.plist
      properties:
        CFBundleDisplayName: Dupe Finder
        CFBundleDevelopmentRegion: es
        URL_BACKEND: "$(URL_BACKEND)"
        CLAVE_APP: "$(CLAVE_APP)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            # Safari ejecuta Preprocesado.js y nos da la página ya cargada.
            NSExtensionJavaScriptPreprocessingFile: Preprocesado
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beeltraan25.dupefinder.share
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  DupeFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DupeFinderTests
    dependencies:
      - target: DupeFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beeltraan25.dupefinder.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  DupeFinder:
    build:
      targets:
        DupeFinder: all
        DupeFinderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DupeFinderTests
