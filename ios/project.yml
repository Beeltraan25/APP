# Proyecto de Xcode descrito en texto. En un Mac: `brew install xcodegen && xcodegen generate`
# crea DupeFinder.xcodeproj (no se sube a git).
name: DupeFinder

options:
  bundleIdPrefix: com.beeltraan25
  developmentLanguage: es
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Todo el código de la app se ejecuta en el hilo principal salvo que se diga lo contrario.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"

packages:
  DupeKit:
    path: Paquetes/DupeKit

targets:
  DupeFinder:
    type: application
    platform: iOS
    sources:
      - path: DupeFinder
    dependencies:
      - package: DupeKit
        product: DupeNucleo
      - package: DupeKit
        product: DupeDiseno
    info:
      path: DupeFinder/Info.plist
      properties:
        CFBundleDisplayName: Dupe Finder
        CFBundleDevelopmentRegion: es
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Para hacer una foto de la prenda que quieres buscar.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beeltraan25.dupefinder
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"

  DupeFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DupeFinderTests
    dependencies:
      - target: DupeFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beeltraan25.dupefinder.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  DupeFinder:
    build:
      targets:
        DupeFinder: all
        DupeFinderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DupeFinderTests
