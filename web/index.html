<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dupe Finder</title>
    <meta name="description" content="Encuentra alternativas parecidas a una prenda en tiendas de España y crea outfits." />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Al añadirla a la pantalla de inicio del iPhone se abre a pantalla completa, como una app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dupe Finder" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="iconos/icono-180.png" />
    <link rel="icon" href="iconos/icono-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="estilos.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main id="contenido" aria-live="polite"></main>

    <nav class="pestanas cristal" role="tablist" aria-label="Secciones">
      <button role="tab" data-pestana="buscar" aria-selected="true">
        <svg viewBox="0 0 24 24" width="24" height="24" class="icono" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z" /><path d="M16 16l5 5" /></svg>
        <span>Buscar</span>
      </button>
      <button role="tab" data-pestana="outfits" aria-selected="false">
        <svg viewBox="0 0 24 24" width="24" height="24" class="icono" aria-hidden="true"><path d="M8 4l-5 3 2 4 3-1v10h8V10l3 1 2-4-5-3c-1 2-2.5 3-4 3s-3-1-4-3z" /></svg>
        <span>Outfits</span>
      </button>
      <button role="tab" data-pestana="guardados" aria-selected="false">
        <svg viewBox="0 0 24 24" width="24" height="24" class="icono" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" /></svg>
        <span>Guardados</span>
      </button>
    </nav>

    <noscript>Dupe Finder necesita JavaScript.</noscript>
  </body>
</html>
